<svg width="520" height="170" viewBox="0 0 520 170" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer bezel with rounded corners -->
  <rect width="520" height="170" rx="12" ry="12" fill="#1C1C1C"/>

  <!-- LCD glass panel -->
  <rect x="14" y="14" width="492" height="142" rx="5" ry="5" fill="#C8A200"/>

  <!-- Subtle inner shadow at top to simulate depth -->
  <rect x="14" y="14" width="492" height="8" rx="5" ry="0" fill="#B89400" opacity="0.5"/>

  <!-- Pixel-row scanlines for LCD texture -->
  <rect x="14" y="14" width="492" height="142" rx="5" ry="5"
        fill="url(#scanlines)" opacity="0.08"/>

  <!-- Reflection highlight at top -->
  <rect x="20" y="18" width="240" height="3" rx="2" ry="2" fill="#FFE040" opacity="0.35"/>

  <defs>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="#000000"/>
    </pattern>
  </defs>

  <!-- Screen text — 4 × 20 HD44780 display -->
  <!-- All values are representative samples:
       K%: fireplace flap (100%), Kom t: exhaust temp (287°C)
       W%: ventilation flap (70%), Zew t: external temp (12.3°C)
       najw: session peak exhaust temp (312°C)
       time 14:23:07  date 16.03.26
  -->
  <text
    font-family="'Courier New', Courier, monospace"
    font-size="22"
    fill="#1A0800"
    font-weight="bold">
    <tspan x="24" y="52"  textLength="472" lengthAdjust="spacingAndGlyphs">K%: 100   Kom t: 287</tspan>
    <tspan x="24" y="83"  textLength="472" lengthAdjust="spacingAndGlyphs">W%:  70  Zew t: 12.3</tspan>
    <tspan x="24" y="114" textLength="472" lengthAdjust="spacingAndGlyphs">           najw: 312</tspan>
    <tspan x="24" y="145" textLength="472" lengthAdjust="spacingAndGlyphs">14:23:07    16.03.26</tspan>
  </text>
</svg>
